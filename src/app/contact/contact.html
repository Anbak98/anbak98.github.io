<div class="contact-container">
  <!-- 아이콘 영역 -->
  <div class="icon-row">
    @for (item of links; track item.name) {
      <a
        class="icon-card"
        [href]="item.url"
        target="_blank"
        rel="noopener noreferrer"
        [title]="item.name"
      >
        <img [src]="item.icon" [alt]="item.name" />
        <span>{{ item.name }}</span>
      </a>
    }
  </div>

  <!-- 연락처 -->
  <div class="contact-info">
    <p>Contact</p>
    <a href="mailto:{{ email }}">{{ email }}</a>
    <p>{{phone}}</p>
  </div>
</div>
